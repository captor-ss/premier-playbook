name: Probe prac pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          UA="Mozilla/5.0 premier-playbook"
          curl -sSL -A "$UA" -m 30 "https://subspacereloaded.com/matches?variant=standard" -o out/list.html -w "%{http_code} list\n" || true
          curl -sSL -A "$UA" -m 30 "https://subspacereloaded.com/matches/svs-4v4-2000" -o out/m.html -w "%{http_code} m\n" || true
          curl -sSL -A "$UA" -m 30 "https://subspacereloaded.com/rankings/svs-4v4" -o out/rank.html -w "%{http_code} rank\n" || true
          for u in api/matches api/matches?variant=standard api/rankings/svs-4v4 robots.txt; do curl -sSL -A "$UA" -m 20 "https://subspacereloaded.com/$u" -o "out/$(echo $u|tr '/?=' '___').txt" -w "%{http_code} $u\n" || true; done
          ls -la out
          git config user.name Claude; git config user.email noreply@anthropic.com
          git checkout -q --orphan probe-out; git rm -rq --cached . ; git add out; git commit -qm probe; git push -qf origin probe-out
